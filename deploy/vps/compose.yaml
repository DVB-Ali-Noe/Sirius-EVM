# Ce qui tourne sur le VPS.
#
# Un seul service pour l'instant : le reaper. C'est délibéré. Le VPS n'héberge ni le
# front — il est sur Vercel, sous un vrai domaine — ni le runner confidentiel, qui
# exige un processeur Intel TDX qu'aucun VPS standard n'expose. Ce que le VPS apporte
# est précisément ce que le serverless ne sait pas faire : un processus qui vit.
#
#   docker compose --env-file .env.vps up --detach --pull always
#
# L'image est désignée par digest et non par tag. Un tag est mutable : `:latest` peut
# pointer sur autre chose demain sans que rien ne le signale, et on redéploie alors un
# contenu qu'on n'a pas relu. Le pipeline écrit le digest exact dans .env.vps.

# Nom de projet explicite : le VPS héberge d'autres piles Compose, et ce nom
# garantit qu'aucune commande Sirius n'atteigne leurs conteneurs.
name: sirius

services:
  reaper:
    image: ${SIRIUS_WORKER_IMAGE:?SIRIUS_WORKER_IMAGE requis, épinglé par digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requise}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      SIRIUS_REAPER_INTERVAL_MS: ${SIRIUS_REAPER_INTERVAL_MS:-30000}
      EVM_NETWORK: ${EVM_NETWORK:?EVM_NETWORK requis}
      EVM_RPC_URL: ${EVM_RPC_URL:-}
      SIRIUS_ESCROW_ADDRESS: ${SIRIUS_ESCROW_ADDRESS:?SIRIUS_ESCROW_ADDRESS requise}

    # Le reaper lit la base et interroge la chaîne. Il n'écrit aucun fichier, n'accepte
    # aucune connexion entrante et ne détient aucun secret d'enclave. Le durcissement
    # ci-dessous ne coûte donc rien en fonctionnalité.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Aucun port publié : rien à joindre depuis l'extérieur.

    # Le worker traite les signaux lui-même et s'arrête à la fin de la passe en cours.
    # Vingt secondes laissent le temps à une passe lente de se terminer plutôt que
    # d'être interrompue au milieu d'une réconciliation.
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: 512M
